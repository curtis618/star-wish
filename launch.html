<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>放入星願｜星願</title>
  <meta name="description" content="挑一件紀念品，選一顆衛星，讓它帶你的心意上太空。" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;600&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/launch.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body class="starry">
  <main class="page launch-layout">
    <section class="viewer glass" aria-label="立方衛星 3D 預覽">
      <canvas id="sat-view"></canvas>
      <div class="viewer-cap">
        <div><b id="vc-name">—</b> <span class="num muted" id="vc-id"></span></div>
        <div class="muted" id="vc-meta"></div>
      </div>
      <div class="viewer-hint muted">拖曳旋轉衛星</div>
    </section>

    <section class="steps">
      <header class="page-head">
        <div class="eyebrow">LOAD YOUR WISH</div>
        <h1>放入星願</h1>
      </header>

      <ol class="stepper" aria-label="步驟">
        <li data-step="1" class="active"><i>1</i>紀念品</li>
        <li data-step="2"><i>2</i>選衛星</li>
        <li data-step="3"><i>3</i>封裝裝填</li>
      </ol>

      <!-- 步驟 1 -->
      <div class="step" id="step-1">
        <h2>挑一件紀念品</h2>
        <p>上傳一張你自己的照片，或選一件系統準備的紀念品。</p>
        <div class="souvenir-grid" id="souvenir-grid">
          <label class="card selectable souvenir upload" id="upload-card">
            <input type="file" accept="image/*" id="upload-input" class="sr-only" />
            <span class="sv-img" id="upload-preview">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M32 42V18M22 28l10-10 10 10"/><path d="M14 40v8a4 4 0 0 0 4 4h28a4 4 0 0 0 4-4v-8"/></svg>
            </span>
            <b>上傳照片</b>
            <small>JPG / PNG，會自動壓縮</small>
          </label>
        </div>
        <div class="field">
          <label for="wish-text">寫一句願望 <span class="muted num" id="wish-count">0/60</span></label>
          <textarea id="wish-text" maxlength="60" rows="2" placeholder="例如：希望明年的這個時候，我們還在一起看星星。"></textarea>
        </div>
        <div class="field">
          <label for="wish-signer">署名（可留白）</label>
          <input id="wish-signer" maxlength="20" placeholder="例如：中大資工 小明" />
        </div>
        <div class="step-actions">
          <span></span>
          <button class="btn btn-primary" id="to-2" disabled>下一步：選衛星 →</button>
        </div>
      </div>

      <!-- 步驟 2 -->
      <div class="step" id="step-2" hidden>
        <h2>選一顆衛星</h2>
        <p>每 30 分鐘一班，發射前 60 秒停止裝填。</p>
        <div class="sat-list" id="sat-list"></div>
        <h3 style="margin-top:22px">選一個格子 <span class="muted" style="font-size:14px;font-weight:400" id="cell-hint"></span></h3>
        <div class="cell-grid" id="cell-grid"></div>
        <div class="cell-legend muted">
          <span><i class="cl cl-free"></i>空位</span><span><i class="cl cl-other"></i>其他旅人</span><span><i class="cl cl-mine"></i>我的</span>
        </div>
        <div class="step-actions">
          <button class="btn" data-back="1">← 上一步</button>
          <button class="btn btn-primary" id="to-3" disabled>下一步：確認 →</button>
        </div>
      </div>

      <!-- 步驟 3 -->
      <div class="step" id="step-3" hidden>
        <h2>確認你的星願</h2>
        <div class="summary card" id="summary"></div>
        <p class="muted" style="font-size:14px;margin-top:12px">星願會保存在這台裝置的瀏覽器裡。換裝置或清除網站資料就會看不到喔。</p>
        <div class="step-actions">
          <button class="btn" data-back="2">← 上一步</button>
          <button class="btn btn-primary" id="do-load">✦ 封裝並裝填</button>
        </div>
      </div>

      <!-- 完成 -->
      <div class="step" id="step-done" hidden>
        <h2>星願已裝填 ✦</h2>
        <p id="done-msg"></p>
        <div class="step-actions wrap">
          <a class="btn btn-primary" id="done-track" href="#">追蹤這顆衛星 →</a>
          <button class="btn" id="done-again">＋ 再放一個</button>
          <a class="btn" href="my-wishes.html">我的星願</a>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/pages/launch.js"></script>
</body>
</html>
